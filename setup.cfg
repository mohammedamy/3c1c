[metadata]
name = 3c1c
version = 1.8.0
author = Mohamed Abdallah (ClipSAT) & Grant Sanderson (ManimGL)
author_email = support@clipsat.org
description = 3c1c — ClipSAT Mathematical Animation Engine & Web Studio
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
home_page = https://github.com/mohammedamy/3c1c
project_urls =
    Bug Tracker = https://github.com/mohammedamy/3c1c/issues
    ClipSAT Platform = https://clipsat.org
    Source Code = https://github.com/mohammedamy/3c1c
license = MIT
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: MIT License
    Topic :: Scientific/Engineering
    Topic :: Multimedia :: Video
    Topic :: Multimedia :: Graphics
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3 :: Only
    Natural Language :: English

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    addict
    appdirs
    audioop-lts; python_version >= "3.13"
    colour
    diskcache
    ipython>=8.18.0
    isosurfaces
    fontTools
    glfw
    manimpango>=0.6.0
    matplotlib
    numpy
    Pillow
    pydub
    pygments
    pyperclip
    pywavefront
    pyyaml
    rendercanvas
    rich
    scipy
    setuptools
    skia-pathops
    svgelements>=1.8.1
    sympy
    trimesh
    tqdm
    typing-extensions; python_version < "3.11"
    validators
    wgpu
[options.extras_require]
web =
    fastapi>=0.100.0
    uvicorn[standard]>=0.23.0
    pydantic>=2.0.0

[options.entry_points]
console_scripts =
    3c1c = manimlib.__main__:main
    clipsat-manim = manimlib.__main__:main
    3c1c-web = server.app:run_cli
    manimgl = manimlib.__main__:main
    manim-render = manimlib.__main__:main
